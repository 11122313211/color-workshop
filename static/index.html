<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>色彩工坊 · 印前色彩管理</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23ff3b30'/><stop offset='50%25' stop-color='%2334c759'/><stop offset='100%25' stop-color='%23007aff'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/></svg>">
</head>
<body>
  <div class="app">
    <!-- 侧边导航（桌面） -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"></div>
        <div>
          <div class="brand-name">色彩工坊</div>
          <div class="brand-sub">印前色彩管理</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-label">工作</div>
        <button class="nav-item" data-route="#/recipes" data-nav="recipes"><span data-icon="wand"></span>配方预测</button>
        <button class="nav-item" data-route="#/files" data-nav="files"><span data-icon="doc"></span>印前转换</button>
        <div class="nav-label">资源</div>
        <button class="nav-item" data-route="#/processes" data-nav="processes"><span data-icon="stack"></span>工艺库<span class="nav-count" id="nav-process-count" hidden></span></button>
        <button class="nav-item" data-route="#/monitor" data-nav="monitor"><span data-icon="chart"></span>监控</button>
        <button class="nav-item" data-route="#/tools" data-nav="tools"><span data-icon="sliders"></span>工具箱</button>
      </nav>
      <div class="sidebar-foot">
        <button class="theme-btn" id="theme-btn"><span data-icon="moon"></span><span id="theme-text">暗色</span></button>
        <span class="ver">v0.4.0</span>
      </div>
    </aside>

    <!-- 主视图 -->
    <main class="main" id="main">
      <div class="view" id="view"></div>
    </main>

    <!-- 底部标签栏（窄屏） -->
    <nav class="tabbar">
      <button class="nav-item" data-route="#/recipes"><span data-icon="wand"></span>配方</button>
      <button class="nav-item" data-route="#/files"><span data-icon="doc"></span>印前</button>
      <button class="nav-item" data-route="#/processes"><span data-icon="stack"></span>工艺</button>
      <button class="nav-item" data-route="#/monitor"><span data-icon="chart"></span>监控</button>
      <button class="nav-item" data-route="#/tools"><span data-icon="sliders"></span>工具</button>
    </nav>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
